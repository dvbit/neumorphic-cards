# Neumorphic Time Picker — COMPLEX
type: custom:timepicker-card
entity: input_datetime.my_time
am_pm: false                 # false = 24h, true = 12h AM/PM
hide_border: false
# ── Text blocks ──
label_major:
  text: Time
  position: top              # top | bottom | none
  font: Space Mono
  size: 0.78rem
  weight: "800"
  spacing: 0.18em
  transform: uppercase
  color: ""
label_minor:
  text: ""
  position: bottom
  size: 0.62rem
  weight: "600"
value:                       # the selected time text
  size: 1.1rem
  weight: "900"
  spacing: 1px
ampm:                        # the AM/PM indicator (when am_pm: true)
  size: 0.55rem
  weight: "800"
  transform: uppercase
icon:
  name: mdi:clock-outline
  position: none             # none | left | right
  size: 1.4rem
